<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">DSTAR review loop</title>
  <desc id="desc">Human direction flows to an agent proposal, then to canonical content after a human decision.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="960" height="280" rx="24" fill="#f7f7f5"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="50" y="90" width="220" height="100" rx="16" fill="#fff" stroke="#777" stroke-width="2"/>
    <text x="160" y="132" font-size="22" font-weight="700">Human</text>
    <text x="160" y="162" font-size="17" fill="#444">directs and decides</text>
    <rect x="370" y="90" width="220" height="100" rx="16" fill="#fff" stroke="#777" stroke-width="2"/>
    <text x="480" y="132" font-size="22" font-weight="700">Agent</text>
    <text x="480" y="162" font-size="17" fill="#444">authors a proposal</text>
    <rect x="690" y="90" width="220" height="100" rx="16" fill="#fff" stroke="#777" stroke-width="2"/>
    <text x="800" y="132" font-size="22" font-weight="700">Canonical</text>
    <text x="800" y="162" font-size="17" fill="#444">accepted content</text>
  </g>
  <path d="M 270 140 L 360 140" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 590 140 L 680 140" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
