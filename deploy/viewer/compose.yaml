services:
  viewer:
    build:
      context: ../..
      dockerfile: deploy/viewer/Dockerfile
    environment:
      DSTAR_PACKAGE_ROOT: /data/document.dstar
      DSTAR_BIND_HOST: 0.0.0.0
      DSTAR_PORT: "3000"
      DSTAR_EXTERNAL_ORIGIN: ${DSTAR_EXTERNAL_ORIGIN:?Set the unique HTTPS origin for this instance}
      DSTAR_OWNER_TOKEN_FILE: /run/secrets/owner_token
      DSTAR_REVIEWER_TOKEN_FILE: /run/secrets/reviewer_token
      DSTAR_OWNER_DISPLAY_NAME: ${DSTAR_OWNER_DISPLAY_NAME:-Owner}
      DSTAR_REVIEWER_DISPLAY_NAME: ${DSTAR_REVIEWER_DISPLAY_NAME:-Reviewer}
    # Only a host-local TLS proxy can reach this published port by default.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - document_data:/data
    secrets:
      - owner_token
      - reviewer_token
    read_only: true
    tmpfs:
      # Agent proposals stage up to 32 MiB before Engine validation/persistence.
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  document_data:

secrets:
  owner_token:
    file: ${DSTAR_OWNER_TOKEN_FILE:?Set the host path of this instance's Owner credential file}
  reviewer_token:
    file: ${DSTAR_REVIEWER_TOKEN_FILE:?Set the host path of this instance's Reviewer credential file}
