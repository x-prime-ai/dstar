<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The same HTML, a different canvas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-dstar-mode="slides">
    <section data-dstar-slide="1" class="slide" data-dstar-id="slide-one">
      <p class="eyebrow" data-dstar-id="slide-one-label">DSTAR / 01</p>
      <h1 data-dstar-id="slide-one-title">
        A different canvas.<br />The same document.
      </h1>
      <p data-dstar-id="slide-one-copy">
        Slides are an authoring convention, not a separate source format.
      </p>
    </section>
    <section data-dstar-slide="2" class="slide light" data-dstar-id="slide-two">
      <p class="eyebrow" data-dstar-id="slide-two-label">DSTAR / 02</p>
      <h1 data-dstar-id="slide-two-title">Propose.<br />Review. Accept.</h1>
      <p data-dstar-id="slide-two-copy">
        The Engine saves the candidate before the Viewer opens it.
      </p>
    </section>
  </body>
</html>
