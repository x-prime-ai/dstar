<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent-created DSTAR document</title>
    <link rel="stylesheet" href="created.css" />
    <script type="module" src="created.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="back" href="./"><span aria-hidden="true">←</span> Documents</a>
      <span class="format" id="format-label">Agent-created document</span>
      <div class="actions">
        <span class="source">Created by agent</span>
        <button id="download" type="button">Download HTML</button>
      </div>
    </header>

    <main>
      <aside class="details">
        <p class="eyebrow">AGENT RESULT</p>
        <dl>
          <div>
            <dt>Created</dt>
            <dd id="created-at">—</dd>
          </div>
          <div>
            <dt>Format</dt>
            <dd id="document-format">—</dd>
          </div>
        </dl>
        <p class="hint">
          This complete HTML document was returned through a short-lived WebMCP
          creation handoff.
        </p>
      </aside>

      <section class="preview-shell" aria-label="Generated document preview">
        <div class="preview-chrome" aria-hidden="true">
          <span></span><span></span><span></span>
          <b>Document preview</b>
        </div>
        <iframe
          id="document-preview"
          title="Generated document"
          sandbox=""
        ></iframe>
      </section>
    </main>

    <div class="missing" id="missing" hidden>
      <p>This agent-created document is not available in this browser.</p>
      <a href="./">Return to Documents</a>
    </div>
  </body>
</html>
